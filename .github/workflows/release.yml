name: Release

on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: Publish the built Python distributions to PyPI
        required: true
        default: true
        type: boolean
      publish_crate:
        description: Publish the Rust crate after its first manual release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" != "tag" || ! "${GITHUB_REF_NAME}" =~ ^v[0-9] ]]; then
            echo "Release workflow must run from a v* tag." >&2
            exit 1
          fi
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          grep -F "## [${version}]" CHANGELOG.md
          echo "value=${version}" >> "${GITHUB_OUTPUT}"

  quality:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: uv sync --extra dev --locked
      - run: uv run ruff check python tests benchmarks examples
      - run: uv run ruff format --check python tests benchmarks examples
      - run: uv run pyright
      - run: uv run pytest --cov=mmwcore

  wheels:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
            python-version: "3.12"
            interpreter: python3.12
          - os: ubuntu-latest
            target: x86_64
            python-version: "3.13"
            interpreter: python3.13
          - os: ubuntu-latest
            target: x86_64
            python-version: "3.14"
            interpreter: python3.14
          - os: windows-latest
            target: x64
            python-version: "3.12"
            interpreter: python
          - os: windows-latest
            target: x64
            python-version: "3.13"
            interpreter: python
          - os: windows-latest
            target: x64
            python-version: "3.14"
            interpreter: python
          - os: macos-latest
            target: universal2-apple-darwin
            python-version: "3.12"
            interpreter: python
          - os: macos-latest
            target: universal2-apple-darwin
            python-version: "3.13"
            interpreter: python
          - os: macos-latest
            target: universal2-apple-darwin
            python-version: "3.14"
            interpreter: python
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: >-
            --release --locked --out dist
            --interpreter ${{ matrix.interpreter }}
            --compatibility pypi
          manylinux: 2_17
      - name: Install wheel
        run: >-
          python -c "import glob, subprocess, sys;
          subprocess.check_call([sys.executable, '-m', 'pip', 'install',
          '--force-reinstall', *glob.glob('dist/*.whl')])"
      - name: Smoke-test installed native and archive APIs
        run: >-
          python -c "import numpy as np; import mmwcore;
          from mmwcore import _native;
          raw = np.array([1, 10, 2, 20], dtype=np.int16);
          decoded = _native.decode_adc_i16(raw, 1, 1, 2, 0, False);
          expected = np.array([[[[1 + 10j, 2 + 20j]]]], dtype=np.complex64);
          assert decoded.shape == (1, 1, 1, 2);
          assert decoded.dtype == np.dtype(np.complex64);
          np.testing.assert_array_equal(decoded, expected);
          evidence = bytes([1, 0, 2, 0]);
          encoded = _native.encode_evidence_frame(evidence);
          assert _native.decode_evidence_frame(encoded, len(evidence)) == evidence;
          assert callable(mmwcore.open_mmwcli_capture_metadata);
          assert callable(mmwcore.open_multisensor_capture_metadata);
          assert callable(mmwcore.open_multisensor_source_timeline);
          print(mmwcore.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: dist/*

  sdist:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: python -m pip install --force-reinstall dist/*.tar.gz
      - name: Smoke-test installed sdist APIs
        run: >-
          python -c "import mmwcore; from mmwcore import _native;
          evidence = bytes([1, 0, 2, 0]);
          encoded = _native.encode_evidence_frame(evidence);
          assert _native.decode_evidence_frame(encoded, len(evidence)) == evidence;
          assert callable(mmwcore.open_mmwcli_capture_metadata);
          assert callable(mmwcore.open_multisensor_capture_metadata);
          assert callable(mmwcore.open_multisensor_source_timeline);
          print(mmwcore.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*

  pypi:
    if: ${{ inputs.publish_pypi }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mmwcore/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  crates-io:
    if: ${{ inputs.publish_crate }}
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
      - id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - run: cargo publish -p mmwcore --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
