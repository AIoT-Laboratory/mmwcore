name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: uv sync --python 3.12 --extra dev --locked
      - if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: uv run --python 3.12 ruff format --check python tests benchmarks examples
      - run: uv run --python 3.12 ruff check --no-cache python tests benchmarks examples
      - run: uv run --python 3.12 pyright
      - run: uv run --python 3.12 python -m pytest -p no:cacheprovider -q
      - run: uv run --python 3.12 python benchmarks/pipeline.py --warmups 0 --samples 1 --stream-frames 2
