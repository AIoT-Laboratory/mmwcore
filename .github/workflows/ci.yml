name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo publish -p mmwcore --dry-run --locked

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --extra dev --locked
      - run: uv run ruff check python tests benchmarks
      - run: uv run ruff format --check python tests benchmarks
      - run: uv run pyright

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --python ${{ matrix.python-version }} --extra dev --locked
      - run: uv run --python ${{ matrix.python-version }} pytest --cov=mmwcore

  package:
    needs: [rust, quality, python]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v7
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          args: >-
            --release --locked --out dist
            --interpreter python3.14
            --compatibility pypi
          manylinux: 2_17
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - run: uv venv --python 3.14 .package-venv
      - run: uv pip install --python .package-venv/bin/python dist/*.whl
      - name: Smoke-test installed native ADC decoding
        run: >-
          .package-venv/bin/python -c "import numpy as np; import mmwcore;
          from mmwcore import _native;
          raw = np.array([1, 10, 2, 20], dtype=np.int16);
          decoded = _native.decode_adc_i16(raw, 1, 1, 2, 0, False);
          expected = np.array([[[[1 + 10j, 2 + 20j]]]], dtype=np.complex64);
          np.testing.assert_array_equal(decoded, expected);
          print(mmwcore.__version__)"
