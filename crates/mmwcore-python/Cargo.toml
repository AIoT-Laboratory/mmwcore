[package]
name = "mmwcore-python"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "PyO3 bindings for the mmwcore Python distribution"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
mmwcore = { path = "../mmwcore", version = "=0.7.0" }
numpy = "0.29"
pyo3 = { version = "0.29", features = ["extension-module"] }
