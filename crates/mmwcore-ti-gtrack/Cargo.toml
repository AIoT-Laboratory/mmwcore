[package]
name = "mmwcore-ti-gtrack"
version.workspace = true
edition.workspace = true
license-file = "TI-LICENSE.txt"
rust-version.workspace = true
publish = false
description = "Rust implementation of TI GTRACK 3DA for TI devices"

[features]
reference-plugin = ["dep:libloading", "dep:sha2"]

[dependencies]
libloading = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
